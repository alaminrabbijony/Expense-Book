name: expense-tracker

services:
  postgres:
    image: docker.io/postgres:18-alpine
    container_name: et-postgres
    restart: unless-stopped        # start with Docker; stay stopped only if I stop it
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password   # local only. Never ship this.
    ports:
      - '54321:5432'                # 54321 avoids clashing with a local Postgres on 5432
    volumes:
      # Postgres 18's image keeps its data in /var/lib/postgresql/18/docker and
      # declares /var/lib/postgresql as its volume. The pre-18 path
      # (/var/lib/postgresql/data) makes the container exit or lose data on
      # restart. Mount the parent; the image creates its own version folder
      # inside, so a future Postgres 19 lives beside 18 instead of on top of it.
      - pgdata:/var/lib/postgresql
    command:
      - -c
      - listen_addresses=*
      - -c
      - wal_level=logical           # required by Electric. Without it, Electric refuses to start.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d expense_tracker']
      interval: 5s
      timeout: 5s
      retries: 5

  electric:
    image: docker.io/electricsql/electric:latest
    container_name: et-electric
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/expense_tracker?sslmode=disable
      # Local dev without an auth secret. If the container rejects this env var,
      # delete it - the flag name has changed across versions.
      ELECTRIC_INSECURE: 'true'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: